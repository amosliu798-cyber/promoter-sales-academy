<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>促销员销售学院</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Design plan.
   Concept: the shelf label. Hard-edged rows on a cool counter surface. The yellow price tag
   carries the one line a promoter must remember today (the day's rule); nothing else gets it.
   Type: system UI faces only, no web fonts; system mono for counts and figures. */
:root {
  --ground: #E7EDEA; --surface: #F6F9F7; --sunk: #D8E2DD; --ink: #10251F; --ink-2: #465B53; --rule: #BCCAC4;
  --action: #0A6A5C; --action-ink: #FFFFFF; --action-soft: #CDE5DD; --focus: #0A6A5C;
  --tag: #FFC71E; --tag-ink: #1C1A0C;
  --good: #0E6F44; --good-soft: #D1EADC; --mid: #795000; --mid-soft: #F5E3BE; --bad: #A9281F; --bad-soft: #F7D9D5;
  --stage: #14322C; --stage-2: #1C4239; --stage-rule: #2C5A4F; --stage-ink: #EEF5F2; --stage-ink-2: #B7CCC4;
  --skin: #C68E62; --skin-2: #A87248; --hair: #21170F; --coat: #22344F; --blouse: #F1F1E8; --shirt: #4F7FA8; --shirt-2: #3E6A90;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --t-xs: 12.5px; --t-sm: 14px; --t-md: 16px; --t-lg: 19px; --t-xl: 24px; --t-2xl: 32px;
  --leading: 1.55; --r: 3px; --tabbar: 62px; --col: 430px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0E1917; --surface: #162421; --sunk: #213330; --ink: #E6EFEB; --ink-2: #A3B8B0; --rule: #33493F;
  --action: #40C9B1; --action-ink: #05201A; --action-soft: #17403A; --focus: #FFD043;
  --tag: #FFD043; --tag-ink: #1C1A0C;
  --good: #5DD09B; --good-soft: #143A2A; --mid: #E8B650; --mid-soft: #3C2F12; --bad: #FF9A90; --bad-soft: #47201C;
  --stage: #0B1F1B; --stage-2: #123029; --stage-rule: #24493F; --stage-ink: #EEF5F2; --stage-ink-2: #AFC6BD;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #0E1917; --surface: #162421; --sunk: #213330; --ink: #E6EFEB; --ink-2: #A3B8B0; --rule: #33493F;
  --action: #40C9B1; --action-ink: #05201A; --action-soft: #17403A; --focus: #FFD043;
  --tag: #FFD043; --tag-ink: #1C1A0C;
  --good: #5DD09B; --good-soft: #143A2A; --mid: #E8B650; --mid-soft: #3C2F12; --bad: #FF9A90; --bad-soft: #47201C;
  --stage: #0B1F1B; --stage-2: #123029; --stage-rule: #24493F; --stage-ink: #EEF5F2; --stage-ink-2: #AFC6BD;
  color-scheme: dark }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: var(--t-md); line-height: var(--leading); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1 { font-size: var(--t-xl); line-height: 1.25; font-weight: 700; text-wrap: balance; }
h2 { font-size: var(--t-lg); line-height: 1.3; font-weight: 700; text-wrap: balance; }
h3 { font-size: var(--t-md); font-weight: 600; }
h1:focus, h2:focus { outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: start; }
button[disabled] { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
svg { display: block; flex: none; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-sm); }
.fine { font-size: var(--t-xs); color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar.static { position: static; }
.topbar-in { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 6px; max-width: 1180px; margin-inline: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); background: var(--ground); flex: none; }
.seg-ctl button { min-height: 44px; min-width: 44px; padding-inline: 12px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); text-align: center; white-space: nowrap; }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.brand { font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); text-align: end; min-width: 0; }

/* Promoter column */
.col { max-width: var(--col); margin-inline: auto; padding-block: 16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 24px; }
.col.flow { padding-block-end: calc(24px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs { max-width: calc(var(--col) - 32px); margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { min-height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--t-xs); font-weight: 600; color: var(--ink-2); text-align: center; border-block-start: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--action); border-block-start-color: var(--action); }

/* Buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: var(--r); background: var(--action); color: var(--action-ink); font-weight: 700; text-align: center; }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.wide { width: 100%; }
.btn[disabled] { background: var(--sunk); color: var(--ink-2); box-shadow: none; }
.btn.demo { background: transparent; color: var(--mid); box-shadow: none; border: 1.5px dashed var(--mid); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); font-weight: 700; padding: 3px 8px; border-radius: 2px; max-width: 100%; }
.chip.tagc { background: var(--tag); color: var(--tag-ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.plain { background: var(--sunk); color: var(--ink-2); }
.chip .ic { width: 14px; height: 14px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--r); flex: none; }
.icon-btn:hover { background: var(--sunk); }
.eyebrow { font-size: var(--t-xs); color: var(--ink-2); font-weight: 600; }

/* Price tag: the rule of the day */
.tag { --hole: var(--ground); position: relative; background: var(--tag); color: var(--tag-ink); padding-block: 14px; padding-inline: 38px 18px; clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px), 0 16px); }
.tag::before { content: ""; position: absolute; left: 14px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: var(--hole); }
.tag .eyebrow { color: inherit; }
.tag-line { font-size: var(--t-xl); font-weight: 700; line-height: 1.3; text-wrap: balance; }
.tag.big { padding-block: 34px; }
.tag.big .tag-line { font-size: var(--t-2xl); }

/* Login */
.demo-note { border: 1.5px dashed var(--mid); background: var(--mid-soft); color: var(--ink); padding: 10px 12px; font-size: var(--t-sm); font-weight: 600; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-weight: 600; }
.fld input[type="text"], .fld input[type="tel"], .fld input[type="password"] { min-height: 48px; padding: 8px 12px; background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--r); width: 100%; min-width: 0; font-size: var(--t-lg); }
.fld input[aria-invalid="true"] { border-color: var(--bad); border-width: 2.5px; }
.numrow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
.pinbox { max-width: 180px; letter-spacing: .3em; }
.err { color: var(--bad); font-size: var(--t-sm); font-weight: 600; }
.check { display: flex; gap: 12px; align-items: center; min-height: 48px; cursor: pointer; font-weight: 600; }
.check input { width: 24px; height: 24px; flex: none; accent-color: var(--action); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 48px; }
.switch .knob { flex: none; width: 52px; height: 30px; border-radius: 15px; background: var(--sunk); border: 1.5px solid var(--ink-2); position: relative; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: var(--ink-2); }
.switch[aria-checked="true"] .knob { background: var(--action); border-color: var(--action); }
.switch[aria-checked="true"] .knob::after { left: 25px; background: var(--action-ink); }

/* Today */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block-end: 6px; border-block-end: 2px solid var(--ink); margin-block-end: 12px; }
.lesson-row { display: flex; gap: 12px; align-items: flex-start; }
.node { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; font-family: var(--font-data); font-weight: 700; background: var(--sunk); color: var(--ink-2); flex: none; }
.node.next { background: var(--tag); color: var(--tag-ink); }
.node.done { background: var(--action); color: var(--action-ink); }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 12px; background: var(--sunk); display: block; }
.pips i.on { background: var(--action); }
.task-text { background: var(--surface); border-inline-start: 4px solid var(--action); padding: 12px 14px; font-weight: 600; }

/* Lesson flow */
.flow-head { display: flex; align-items: center; gap: 8px; }
.flow-head h1 { font-size: var(--t-md); line-height: 1.3; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; background: var(--sunk); display: block; }
.segs i.on { background: var(--action); }
.segs i.cur { background: var(--tag); box-shadow: 0 0 0 1px var(--ink); }
.stage { position: relative; overflow: hidden; background: var(--stage); color: var(--stage-ink); padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px;
  background-image: repeating-linear-gradient(0deg, transparent 0 56px, var(--stage-rule) 56px 58px); }
.stage-meta { display: flex; justify-content: space-between; gap: 8px; font-size: var(--t-xs); color: var(--stage-ink-2); }
.figure { width: min(58vw, 210px); margin-inline: auto; }
.f-skin { fill: var(--skin); } .f-skin2 { fill: var(--skin-2); } .f-hair { fill: var(--hair); } .f-shirt { fill: var(--shirt); } .f-shirt2 { fill: var(--shirt-2); }
.s-face { fill: none; stroke: var(--hair); stroke-width: 3.5; stroke-linecap: round; }
.stage .tag { --hole: var(--stage); margin-block-start: -22px; }
.panel { background: var(--surface); padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
.panel .big { font-size: var(--t-lg); font-weight: 600; line-height: 1.55; }
.panel.dont { border-block-start: 5px solid var(--bad); }
.panel.say { border-block-start: 5px solid var(--good); }
.extra { border-block-start: 1px solid var(--rule); padding-block-start: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Rules list */
.rules li { border-block-end: 1px solid var(--rule); }
.rule-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding-block: 12px; min-height: 64px; }
.rule-item.locked { color: var(--ink-2); }
.rule-item strong { display: block; font-size: var(--t-md); line-height: 1.45; }
.rule-item .ch { color: var(--ink-2); margin-block-start: 6px; }

/* Me */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--rule); border: 2px solid var(--rule); }
.stats div { background: var(--surface); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats strong { font-family: var(--font-data); font-size: var(--t-2xl); line-height: 1.15; }
.rep { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: var(--t-sm); }
.rep .bar { grid-column: 2 / -1; }
.bar { height: 8px; background: var(--sunk); }
.bar b { display: block; height: 100%; background: var(--action); max-width: 100%; }
.bar.red b { background: var(--bad); }
.log li { display: flex; gap: 12px; padding-block: 9px; border-block-end: 1px solid var(--rule); font-size: var(--t-sm); }
.log time { color: var(--ink-2); flex: none; min-width: 64px; }
.today-list li { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; border-block-end: 1px solid var(--rule); font-size: var(--t-sm); }

/* Admin */
.admin { max-width: 1180px; margin-inline: auto; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 28px; }
.banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: repeating-linear-gradient(-45deg, var(--tag) 0 12px, var(--mid-soft) 12px 24px); color: var(--tag-ink); padding: 10px 12px; font-weight: 700; display: flex; }
.banner span { background: var(--tag); padding: 4px 10px; }
.a-sec > h2 { padding-block-end: 8px; border-block-end: 2px solid var(--ink); margin-block-end: 14px; }
.a-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 28px 40px; }
.a-grid > * { min-width: 0; }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 28px; }
.kpi strong { display: block; font-family: var(--font-data); font-size: var(--t-2xl); line-height: 1.15; }
.scroll-x { overflow-x: auto; }
table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: var(--t-sm); }
th, td { padding: 9px 8px; text-align: start; border-block-end: 1px solid var(--rule); white-space: nowrap; }
th { font-size: var(--t-xs); color: var(--ink-2); font-weight: 600; }
td.n, th.n { text-align: end; }
td.n { font-family: var(--font-data); }
th button { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-weight: 700; color: var(--ink); }
.field { min-height: 44px; padding: 8px 10px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: var(--r); max-width: 100%; }
input.field { width: 100%; }
textarea.field { width: 100%; min-height: 150px; font-size: var(--t-sm); resize: vertical; line-height: 1.6; }
.rank li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; padding-block: 10px; border-block-end: 1px solid var(--rule); font-size: var(--t-sm); align-items: baseline; }
.rank .bar { grid-column: 2 / -1; }
.people { max-height: 320px; overflow-y: auto; border-block-end: 1px solid var(--rule); margin-block-start: 8px; }
.person { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 2px; border-block-start: 1px solid var(--rule); font-size: var(--t-sm); }
.person[aria-pressed="true"] { background: var(--action-soft); }
.detail { padding: 12px 0 0; display: flex; flex-direction: column; gap: 10px; }
.detail dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: var(--t-sm); }
.detail dt { color: var(--ink-2); }
.cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.cells div { padding: 6px 4px; background: var(--sunk); color: var(--ink-2); font-size: var(--t-xs); text-align: center; line-height: 1.35; min-width: 0; }
.cells div.c1 { background: var(--action-soft); color: var(--ink); }
.cells div.c2 { background: var(--action); color: var(--action-ink); }
.empty-so { border: 1.5px dashed var(--rule); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.so-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.so-groups div { background: var(--sunk); padding: 10px; font-size: var(--t-sm); }
.so-groups strong { display: block; font-family: var(--font-data); font-size: var(--t-xl); color: var(--ink-2); }

/* ---------- Interactive lesson (video + questions, Duolingo-style loop) ---------- */
.i-top { display: flex; align-items: center; gap: 10px; }
.i-bar { flex: 1; height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.i-bar b { display: block; height: 100%; background: var(--action); border-radius: 6px; transition: width .35s ease; }
.i-xp { font-family: var(--font-data); font-size: var(--t-sm); font-weight: 700; color: var(--mid); display: inline-flex; align-items: center; gap: 4px; flex: none; }
.i-card { display: flex; flex-direction: column; gap: 14px; }
.i-q { font-size: var(--t-lg); font-weight: 700; line-height: 1.4; text-wrap: pretty; }
.i-redo { font-size: var(--t-xs); font-weight: 700; color: var(--mid); }
.vid { position: relative; background: var(--stage); aspect-ratio: 3 / 4; width: 100%; max-height: 62vh; margin-inline: auto; overflow: hidden; }
.vid video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--stage); }
.vid-play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 20, 17, .45); color: #fff; font-weight: 700; gap: 10px; align-content: center; }
.vid-play span.ring { width: 72px; height: 72px; border-radius: 50%; background: var(--tag); color: var(--tag-ink); display: grid; place-items: center; }
.vid-play[hidden] { display: none; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: start; width: 100%; padding: 14px; background: var(--surface); border-radius: 10px; box-shadow: inset 0 0 0 2px var(--rule), 0 3px 0 var(--rule); font-size: var(--t-md); line-height: 1.45; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-data); font-size: var(--t-xs); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--rule); color: var(--ink-2); }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--action), 0 3px 0 var(--action); background: var(--action-soft); }
.opt[aria-pressed="true"] .k { box-shadow: inset 0 0 0 1.5px var(--action); color: var(--action); }
.opt.right { box-shadow: inset 0 0 0 2px var(--good), 0 3px 0 var(--good); background: var(--good-soft); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad), 0 3px 0 var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.ans-line { min-height: 112px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 0; border-block: 1.5px solid var(--rule); background: repeating-linear-gradient(to bottom, transparent 0 51px, var(--rule) 51px 52.5px); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { padding: 9px 13px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--rule), 0 3px 0 var(--rule); font-weight: 600; font-size: var(--t-md); }
.tile.used { visibility: hidden; }
.tile.slot { visibility: visible; background: var(--sunk); color: transparent; box-shadow: none; }
.mic-wrap { display: grid; justify-items: center; gap: 10px; padding-block: 8px; }
.mic { width: 92px; height: 92px; border-radius: 50%; background: var(--action); color: var(--action-ink); display: grid; place-items: center; box-shadow: 0 5px 0 color-mix(in srgb, var(--action) 60%, #000); }
.mic .ic { width: 38px; height: 38px; }
.mic[data-state="listening"] { background: var(--bad); box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 25%, transparent), 0 5px 0 color-mix(in srgb, var(--bad) 60%, #000); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--bad) 10%, transparent), 0 5px 0 color-mix(in srgb, var(--bad) 60%, #000); } }
.heard { min-height: 80px; padding: 12px 14px; background: var(--surface); border-radius: 10px; font-size: var(--t-md); line-height: 1.5; }
.heard .part { color: var(--ink-2); }

.checks li.ok { color: var(--good); } .checks li.no { color: var(--bad); }
.sheet { position: sticky; bottom: 0; margin-inline: -16px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ground); border-block-start: 2px solid var(--rule); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.sheet.good { background: var(--good-soft); border-color: var(--good); }

.sheet.good h2 { color: var(--good); } .sheet.bad h2 { color: var(--bad); }
.sheet .btn.ok { background: var(--good); color: #fff; } .sheet.bad .btn.ok { background: var(--bad); color: #fff; }
.sheet p { font-size: var(--t-sm); line-height: 1.5; }
.sheet .lbl { font-weight: 700; }
.i-end { text-align: center; display: grid; gap: 14px; justify-items: center; }
.i-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.i-stat { border-radius: 10px; padding: 12px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--rule); }

.i-stat span { font-size: var(--t-xs); color: var(--ink-2); font-weight: 600; }
.jq { padding: 22px 18px; background: var(--surface); border-radius: 14px; box-shadow: inset 0 0 0 2px var(--rule), 0 4px 0 var(--rule); font-size: var(--t-lg); font-weight: 600; line-height: 1.45; min-height: 130px; display: grid; align-content: center; }
.jq.right { box-shadow: inset 0 0 0 2px var(--good), 0 4px 0 var(--good); background: var(--good-soft); }
.jq.wrong { box-shadow: inset 0 0 0 2px var(--bad), 0 4px 0 var(--bad); background: var(--bad-soft); animation: shake .36s ease-in-out; }
.jcount { display: flex; gap: 6px; }
.jcount i { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); }
.jcount i.ok { background: var(--good); } .jcount i.no { background: var(--bad); } .jcount i.cur { background: var(--tag); }
.jbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.jbtn .ic { width: 24px; height: 24px; }
.jbtn.bad { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad), 0 4px 0 var(--bad); }
.jbtn.good { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 2px var(--good), 0 4px 0 var(--good); }
.jbtn:active { transform: translateY(3px); box-shadow: none; }
.method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.method div { background: var(--surface); border-radius: 10px; padding: 10px; box-shadow: inset 0 0 0 1.5px var(--rule); }
.method b { display: block; font-size: var(--t-sm); }
.method span { font-size: var(--t-xs); color: var(--ink-2); line-height: 1.35; display: block; margin-block-start: 2px; }
.cust { background: var(--surface); border-radius: 14px; box-shadow: inset 0 0 0 2px var(--rule); padding: 16px; display: grid; gap: 10px; }
.cust-h { display: flex; gap: 12px; align-items: center; }
.cust-av { width: 52px; height: 52px; border-radius: 50%; background: var(--stage); color: var(--stage-ink); display: grid; place-items: center; font-weight: 800; font-size: var(--t-lg); flex: none; }
.cust-who { font-size: var(--t-sm); line-height: 1.45; }
.cust ul { display: grid; gap: 6px; }
.cust li { list-style: none; display: flex; gap: 8px; align-items: flex-start; font-size: var(--t-sm); line-height: 1.45; }
.cust li .ic { width: 18px; height: 18px; flex: none; margin-block-start: 1px; color: var(--action); }
.intents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.intent { min-height: 56px; border-radius: 10px; padding: 6px; font-weight: 700; font-size: var(--t-sm); background: var(--surface); box-shadow: inset 0 0 0 2px var(--rule), 0 3px 0 var(--rule); line-height: 1.25; }
.intent .meter { display: flex; gap: 3px; justify-content: center; margin-block-end: 4px; }
.intent .meter i { width: 14px; height: 5px; border-radius: 2px; background: var(--rule); }
.intent .meter i.on { background: var(--action); }
.intent.right { box-shadow: inset 0 0 0 2px var(--good), 0 3px 0 var(--good); background: var(--good-soft); }
.intent.close { box-shadow: inset 0 0 0 2px var(--mid), 0 3px 0 var(--mid); background: var(--mid-soft); }
.intent.wrong { box-shadow: inset 0 0 0 2px var(--bad), 0 3px 0 var(--bad); background: var(--bad-soft); }
.intent.truth { box-shadow: inset 0 0 0 2px var(--good), 0 3px 0 var(--good); }
.opt.ok2 { box-shadow: inset 0 0 0 2px var(--mid), 0 3px 0 var(--mid); background: var(--mid-soft); }
.grade { font-size: var(--t-xs); font-weight: 800; padding: 2px 7px; border-radius: 4px; margin-inline-start: auto; flex: none; align-self: flex-start; }
.grade.g2 { background: var(--good); color: #fff; } .grade.g1 { background: var(--mid); color: #fff; } .grade.g0 { background: var(--bad); color: #fff; }
.sheet.mid { background: var(--mid-soft); border-color: var(--mid); }
.sheet.mid h2 { color: var(--mid); } .sheet.mid .btn.ok { background: var(--mid); color: #fff; }
.rstep { font-size: var(--t-sm); font-weight: 800; }
.sync { font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); padding: 4px 8px; border-radius: 6px; background: var(--sunk); }
.sync[data-sync="cloud"] { color: var(--good); background: var(--good-soft); }
.dbg-lessons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.dbg-lessons .btn { min-height: 40px; padding: 0; }
[data-debug] { box-shadow: inset 0 0 0 2px var(--mid); }
/* Feedback effects */
.sheet { animation: sheet-in .22s ease-out; }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
.opt.wrong { animation: shake .36s ease-in-out; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.opt.right.pop, .jq.pop, .sheet.good h2 .ic { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
.i-xp.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 40% { transform: scale(1.35); color: var(--good); } }
.xp-fly { position: fixed; z-index: 30; pointer-events: none; font-family: var(--font-data); font-weight: 800; font-size: var(--t-lg); color: var(--good); animation: xp-fly .9s ease-out forwards; }
@keyframes xp-fly { from { transform: translate(-50%, 0) scale(.8); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -8px) scale(1.15); } to { transform: translate(-50%, -54px) scale(1); opacity: 0; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 29; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: burst var(--t, .95s) cubic-bezier(.2, .7, .4, 1) forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
.i-end h1 { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
.snd { color: var(--ink-2); }
.snd[aria-pressed="false"] { opacity: .55; }

@media (prefers-reduced-motion: reduce) { .mic[data-state="listening"] { animation: none; } }

<script type="application/json" id="course-data">{"course":{"title":"基础销售十个动作","intro":"10 节课只练 10 个基础销售动作。每节一个场景、一句口诀、一个门店任务。","greeting":"Welcome to Xiaomi","recall_days":[1,3,7,14,30],"max_recall_per_day":3,"task_target":3},"lessons":[{"no":1,"code":"A1","title":"主动迎接","moment":"顾客走近小米专区","scene":"顾客走进多品牌店，看了几个品牌的柜台，走近小米专区。","dont":"低头看手机，等顾客开口。或者上来就问“要买手机吗？”，顾客只会回答“随便看看”。","say":"“Welcome to Xiaomi！您今天想看拍照好一点的，还是电池耐用一点的？”","extra":[{"label":"顾客说随便看看","text":"“好的，您慢慢看。这几台都可以拿起来试，有问题随时叫我。”然后留在附近，不跟着走。"}],"rule":"先说 Welcome to Xiaomi，再问一个他答得上的问题。","practice":"顾客走近柜台，还没有说话。说出你的第一句话。","task":"如果顾客走近小米专区，我就先说 Welcome to Xiaomi，再问一个二选一的问题。","recall":{"q":"顾客说“随便看看”，你接下来说什么、做什么？","a":"说“您慢慢看，这几台都可以拿起来试，有问题随时叫我”，然后留在附近，不跟着走。"}},{"no":2,"code":"B1","title":"三问定需求","moment":"“给我推荐一台”","scene":"顾客说：“我想换个手机，你给推荐一台。”","dont":"马上拿起主推机型：“这款最新，卖得最好。”","say":"先问三句：“您平时用手机做得最多的是什么？”“现在这台最让您头疼的是哪一点？”“您大概想看什么价位的？”","extra":[{"label":"顾客已点名机型","text":"直接拿给他，只补一句：“您看中它哪一点？”"}],"rule":"先问三句，再拿手机。","practice":"顾客说“给我推荐一台”。说出你的三个问题。","task":"如果顾客让我推荐，我就先问用途、最头疼的一点和价位。","recall":{"q":"三问分别问什么？","a":"平时用手机做得最多的是什么；现在这台最头疼的是哪一点；大概想看什么价位。"}},{"no":3,"code":"C1","title":"讲一个卖点，递到他手里","moment":"顾客说出一个需求","scene":"顾客说：“我的手机到下午就没电了。”","dont":"一口气背参数，把电池、屏幕、相机全讲一遍。","say":"“您说下午就没电，这台是大电池，所以白天您不用总惦记着充电。来，您拿着试试。”","extra":[{"label":"句式","text":"您说……，这台有……，所以您……。说完把手机递到顾客手里。"},{"label":"注意","text":"卖点只说产品资料上有的，不夸大。"}],"rule":"他说什么就讲什么，再递到他手里。","practice":"顾客说“我主要用来拍孩子”。用这个句式说一句，并说出你让他试什么。","task":"如果顾客说出一个需求，我就只讲对应的一个卖点，并让他上手试。","recall":{"q":"顾客说“手机总是卡”，你讲几个卖点？讲完做什么？","a":"只讲一个和“卡”对应的卖点，讲完把手机递到他手里让他试。"}},{"no":4,"code":"E3","title":"“这台多少钱”","moment":"“这台多少钱”","scene":"顾客指着一台手机：“这个多少钱？”","dont":"只报一个数字，然后沉默。或者不回答，反问“您预算多少？”","say":"“这台是 X 镑。您是自己用，还是给家人买？”","extra":[{"label":"也可以问","text":"“您现在用的是哪一款？”"}],"rule":"报完价，马上问一句。","practice":"顾客问“这个多少钱”。说出你报价之后接的那句话。","task":"如果顾客只问价，我就报完价马上问一个问题。","recall":{"q":"顾客问价时，哪两种做法会让对话结束？","a":"只报数字然后沉默；不回答价格，反问顾客预算。"}},{"no":5,"code":"E1","title":"先接住，再回应","moment":"顾客提出顾虑","scene":"顾客皱着眉说：“我听说这个牌子用久了会卡。”","dont":"立刻反驳：“不会的，那是以前的事。”","say":"“您是担心用久了会变慢，对吗？您现在这台是用了多久开始卡的？”","extra":[{"label":"三步","text":"听完不打断；用自己的话复述顾虑；问一个问题，然后再回应。"}],"rule":"先听完，复述一遍，再问一句。","practice":"顾客说“我朋友说这个牌子拍照不行”。说出你的复述和提问。","task":"如果顾客提出顾虑，我就先复述一遍，再问一句。","recall":{"q":"回应顾虑之前的三步是什么？","a":"听完不打断；复述顾客的顾虑；问一个问题。"}},{"no":6,"code":"E2","title":"“太贵了”","moment":"“太贵了”","scene":"顾客看完价格说：“太贵了。”","dont":"“这不贵，对面那款质量差。”或者马上说“我帮您申请便宜点”。","say":"“我理解，买手机是一笔不小的开支。您心里大概想在什么价位？还是看到了别的更合适的？”","extra":[{"label":"超出预算","text":"推荐低一档的机型，说清两台差在哪里。"},{"label":"觉得不值","text":"回到他说过的需求，讲一个卖点，让他上手试。"},{"label":"看到更便宜的","text":"用第 7 课的方法。"}],"rule":"先问清原因，再谈价格。","practice":"顾客说“太贵了”。说出你的第一句话和接着问的问题。","task":"如果顾客说贵，我就先说一句认可的话，再问一个问题。","recall":{"q":"“太贵了”背后常见的三种原因是什么？","a":"超出预算；觉得不值；看到了更便宜的。"}},{"no":7,"code":"E4","title":"“别家更便宜”","moment":"“别家更便宜”","scene":"顾客拿出手机：“网上这台便宜好几百。”或者说：“隔壁店报的价更低。”","dont":"“网上的都是假货。”或者“那您去那边买吧。”","say":"“货比三家是应该的。方便给我看一下吗？我帮您对一下是不是同一个配置。”","extra":[{"label":"核对三项","text":"是不是同一机型和内存；是不是正规渠道、有发票；今天能不能拿到。"},{"label":"然后","text":"说清在这里买能得到什么：现场验机，今天带走，有问题可以回来找我。没有官方政策时不跟价。"}],"rule":"先看清是不是同一样东西，再比。","practice":"顾客说“隔壁便宜两百”。说出你的第一句话和要核对的三项。","task":"如果顾客说别家更便宜，我就先请他给我看，再核对三项。","recall":{"q":"顾客说别家更便宜，要核对哪三项？","a":"是不是同一机型和内存；是不是正规渠道、有发票；今天能不能拿到。"}},{"no":8,"code":"D1","title":"“那个牌子更好”","moment":"“那个牌子更好”","scene":"顾客指着旁边的柜台：“那个牌子不是更好吗？”","dont":"“他们只是牌子贵，配置不如我们。”对方促销员就在旁边，顾客也不会因此更信任你。","say":"“那款也是不错的选择。您最看重它哪一点？”","extra":[{"label":"然后","text":"只比顾客说的这一项。看重拍照，就用样机现场拍一张让他自己看；看重品牌，不争论，请他上手体验这一台。"}],"rule":"不说别人差，只比他在意的那一项。","practice":"顾客说“我还是觉得那个牌子好”。说出你的回应和提问。","task":"如果顾客提到别的品牌，我就先肯定，再问他看中哪一点。","recall":{"q":"顾客提到别的品牌时，你不能说什么？应该问什么？","a":"不能说对方差；应该问“您最看重它哪一点？”"}},{"no":9,"code":"F3","title":"收到两台，问一句","moment":"顾客拿不定主意","scene":"顾客已经看了四五台，还是拿不定主意。","dont":"继续介绍第六台。或者说“您慢慢考虑”，然后走开。","say":"“您刚才说最看重电池和拍照。按这两点，这两台最合适：这台电池更大，这台拍照更好。您更倾向哪一台？”","extra":[{"label":"然后","text":"问完停下，等顾客回答，不要自己接话。"}],"rule":"收到两台，问一句，然后等。","practice":"顾客说过“预算有限，主要打游戏”，现在已经看了五台。说出你怎么收窄和提问。","task":"如果顾客看了三台以上还没决定，我就收到两台，问他更倾向哪一台。","recall":{"q":"问完“您更倾向哪一台”之后，你做什么？","a":"停下，等顾客回答，不自己接话。"}},{"no":10,"code":"G1","title":"开单前推荐一件配件","moment":"顾客选定了机型","scene":"顾客已经选定机型，你准备开单。","dont":"付款之后才问：“要不要买个壳？”或者不问就把配件加进单里。","say":"“您刚才说常在外面跑，屏幕最怕摔。壳和膜加起来 X 镑，要我现在一起帮您装好吗？”","extra":[{"label":"规则","text":"按顾客说过的需求推荐一件，先报价，他同意后才开单。"}],"rule":"开单前推荐一件，先报价再问。","practice":"顾客说过“经常出差”，现在选定了机型。说出你推荐什么、怎么说。","task":"如果顾客选定机型，我就在开单前按他的需求推荐一件配件。","recall":{"q":"推荐配件的时机是什么？开口先说什么？","a":"顾客选定机型后、开单之前；先说他提过的需求，再报价，然后问要不要。"}}],"en":{"course":{"title":"10 Basic Selling Moves","intro":"10 short lessons, 10 basic selling moves. Each lesson has one situation, one rule and one task for the shop floor.","greeting":"Welcome to Xiaomi"},"lessons":[{"no":1,"code":"A1","title":"Greet first","moment":"A customer walks up to the Xiaomi zone","scene":"A customer walks into the multi-brand store, looks at a few brand counters, then walks up to the Xiaomi zone.","dont":"Looking at your phone and waiting for the customer to speak. Or asking \"Do you want to buy a phone?\" The customer will only say \"Just looking.\"","say":"\"Welcome to Xiaomi! Are you looking for a better camera today, or a longer battery?\"","extra":[{"label":"If they say \"just looking\"","text":"\"Of course, take your time. You can pick up any of these phones and try them. Call me if you need anything.\" Then stay close, but don't follow them."}],"rule":"Say \"Welcome to Xiaomi\" first, then ask a question the customer can answer.","practice":"A customer walks up to the counter and hasn't said anything yet. Say your first sentence.","task":"If a customer walks up to the Xiaomi zone, I will say \"Welcome to Xiaomi\" first, then ask an either-or question.","recall":{"q":"The customer says \"just looking\". What do you say and do next?","a":"Say \"Take your time, you can pick up and try any of these phones, call me if you need anything.\" Then stay close, but don't follow them."}},{"no":2,"code":"B1","title":"Ask three questions","moment":"\"Recommend one for me\"","scene":"The customer says: \"I want a new phone. Recommend one for me.\"","dont":"Picking up the model you are pushing right away: \"This one is the newest and sells the best.\"","say":"Ask three questions first: \"What do you use your phone for most?\" \"What bothers you most about your current phone?\" \"What price range are you looking at?\"","extra":[{"label":"If they already named a model","text":"Hand it to them and ask just one question: \"What do you like about it?\""}],"rule":"Ask three questions before you pick up a phone.","practice":"The customer says \"Recommend one for me.\" Say your three questions.","task":"If a customer asks me to recommend a phone, I will first ask about use, the biggest problem, and price range.","recall":{"q":"What are the three questions?","a":"What do you use your phone for most? What bothers you most about your current phone? What price range are you looking at?"}},{"no":3,"code":"C1","title":"One need, one benefit, in their hand","moment":"The customer tells you a need","scene":"The customer says: \"My phone is dead by the afternoon.\"","dont":"Listing every spec in one breath: battery, screen, camera, everything.","say":"\"You said your phone is dead by the afternoon. This one has a big battery, so you don't have to think about charging during the day. Here, try it.\"","extra":[{"label":"Pattern","text":"You said ... This one has ... So you ... Then put the phone in the customer's hand."},{"label":"Note","text":"Only mention benefits that are in the product materials. Don't exaggerate."}],"rule":"Talk about what they told you, then put the phone in their hand.","practice":"The customer says \"I mostly take photos of my kids.\" Use the pattern in one sentence, and say what you will let them try.","task":"If a customer tells me a need, I will talk about one matching benefit only and let them try the phone.","recall":{"q":"The customer says \"my phone is always slow\". How many benefits do you talk about? What do you do after?","a":"Only one, the one that matches \"slow\". Then put the phone in their hand and let them try it."}},{"no":4,"code":"E3","title":"\"How much is this?\"","moment":"\"How much is this?\"","scene":"The customer points at a phone: \"How much is this one?\"","dont":"Giving a number and then going silent. Or not answering and asking back \"What's your budget?\"","say":"\"This one is X pounds. Is it for you, or for someone in your family?\"","extra":[{"label":"You can also ask","text":"\"Which phone are you using now?\""}],"rule":"Give the price, then ask one question right away.","practice":"The customer asks \"How much is this one?\" Say the sentence you add after the price.","task":"If a customer only asks the price, I will give the price and ask one question right away.","recall":{"q":"When a customer asks the price, which two reactions end the conversation?","a":"Giving a number and going silent. Not answering and asking for their budget instead."}},{"no":5,"code":"E1","title":"Catch it before you answer","moment":"The customer has a concern","scene":"The customer frowns and says: \"I heard this brand gets slow after a while.\"","dont":"Arguing right away: \"No, that was in the past.\"","say":"\"You're worried it will get slow over time, right? How long did you use your current phone before it got slow?\"","extra":[{"label":"Three steps","text":"Listen without interrupting. Repeat the concern in your own words. Ask one question, then answer."}],"rule":"Listen, repeat it back, then ask one question.","practice":"The customer says \"My friend says this brand's camera is bad.\" Say how you repeat it back and what you ask.","task":"If a customer has a concern, I will repeat it back first, then ask one question.","recall":{"q":"What are the three steps before you answer a concern?","a":"Listen without interrupting. Repeat the concern back. Ask one question."}},{"no":6,"code":"E2","title":"\"Too expensive\"","moment":"\"Too expensive\"","scene":"The customer looks at the price and says: \"That's too expensive.\"","dont":"\"It's not expensive, the one across the aisle is poor quality.\" Or saying right away \"Let me get you a discount.\"","say":"\"I understand, a phone is a big purchase. What price did you have in mind? Or did you see something that suits you better?\"","extra":[{"label":"Over budget","text":"Recommend the model one step down and explain clearly what is different."},{"label":"Not worth it to them","text":"Go back to the need they told you, talk about one benefit, and let them try it."},{"label":"They saw a cheaper one","text":"Use the method from Lesson 7."}],"rule":"Find out why first, then talk about price.","practice":"The customer says \"Too expensive.\" Say your first sentence and the question you ask next.","task":"If a customer says it's expensive, I will first show I understand, then ask one question.","recall":{"q":"What are the three common reasons behind \"too expensive\"?","a":"It is over their budget. They don't feel it is worth it. They saw a cheaper one."}},{"no":7,"code":"E4","title":"\"It's cheaper somewhere else\"","moment":"\"It's cheaper somewhere else\"","scene":"The customer takes out their phone: \"It's a few hundred cheaper online.\" Or says: \"The shop next door gave me a lower price.\"","dont":"\"Everything online is fake.\" Or \"Then go and buy it there.\"","say":"\"It's right to compare. May I have a look? Let me check if it's the same version.\"","extra":[{"label":"Check three things","text":"Is it the same model and memory? Is it from an official channel, with an invoice? Can they get it today?"},{"label":"Then","text":"Say clearly what they get here: check the phone on the spot, take it home today, come back to me if there is a problem. Don't match the price unless there is an official offer."}],"rule":"Check it's the same thing before you compare.","practice":"The customer says \"Next door is 200 cheaper.\" Say your first sentence and the three things you check.","task":"If a customer says it's cheaper somewhere else, I will ask to see it, then check three things.","recall":{"q":"The customer says it's cheaper somewhere else. Which three things do you check?","a":"Same model and memory? Official channel with an invoice? Can they get it today?"}},{"no":8,"code":"D1","title":"\"That brand is better\"","moment":"\"That brand is better\"","scene":"The customer points at the next counter: \"Isn't that brand better?\"","dont":"\"They are just an expensive name. Their specs are worse than ours.\" Their promoter is standing right there, and the customer won't trust you more for it.","say":"\"That's a good choice too. What do you like most about it?\"","extra":[{"label":"Then","text":"Compare only the one thing they named. If it's the camera, take a photo with the demo phone and let them judge. If it's the brand, don't argue. Invite them to try this one."}],"rule":"Never say the other brand is bad. Compare only what they care about.","practice":"The customer says \"I still think that brand is better.\" Say your reply and your question.","task":"If a customer mentions another brand, I will say something positive first, then ask what they like about it.","recall":{"q":"When a customer mentions another brand, what must you not say? What should you ask?","a":"Don't say the other brand is bad. Ask \"What do you like most about it?\""}},{"no":9,"code":"F3","title":"Narrow to two, then ask","moment":"The customer can't decide","scene":"The customer has looked at four or five phones and still can't decide.","dont":"Showing a sixth phone. Or saying \"Take your time\" and walking away.","say":"\"You said battery and camera matter most. For those two, these are the best fit: this one has the bigger battery, this one has the better camera. Which one do you prefer?\"","extra":[{"label":"Then","text":"Stop talking and wait for the answer. Don't fill the silence."}],"rule":"Narrow to two, ask one question, then wait.","practice":"The customer said \"My budget is tight and I mostly play games\", and has now seen five phones. Say how you narrow it down and what you ask.","task":"If a customer has seen three or more phones and hasn't decided, I will narrow to two and ask which one they prefer.","recall":{"q":"After you ask \"Which one do you prefer?\", what do you do?","a":"Stop talking and wait for the customer to answer."}},{"no":10,"code":"G1","title":"Offer one accessory before the bill","moment":"The customer has chosen a phone","scene":"The customer has chosen a model and you are about to write the bill.","dont":"Asking only after payment: \"Do you want a case?\" Or adding accessories to the bill without asking.","say":"\"You said you are out all day, and screens break easily. The case and screen protector together are X pounds. Shall I put them on for you now?\"","extra":[{"label":"Rule","text":"Recommend one item based on what the customer told you. Give the price first. Add it to the bill only after they agree."}],"rule":"Before the bill, offer one item. Price first, then ask.","practice":"The customer said \"I travel a lot for work\" and has now chosen a model. Say what you recommend and how you say it.","task":"If a customer has chosen a model, I will recommend one accessory based on their need before I write the bill.","recall":{"q":"When do you recommend an accessory? What do you say first?","a":"After the customer has chosen the model and before the bill. Start with the need they mentioned, give the price, then ask."}}]}}</script>
<script type="application/json" id="inter-data">{"1":{"cards":[{"type":"clip","src":"media/L1-S0.mp4","eyebrow":"Welcome","title":"Meet Layla, your sales coach","intro":true,"dur":13.2},{"type":"clip","src":"media/L1-S1.mp4","eyebrow":"Watch","title":"What do you say first?","dur":13.2},{"type":"clip","src":"media/L1-S2.mp4","eyebrow":"Watch","title":"Greet, then one easy question","dur":12.3},{"type":"choice","eyebrow":"Choose","q":"A customer walks up to the Xiaomi zone. What do you say first?","options":[{"t":"\"Do you want to buy a phone?\"","ok":false,"why":"This is a yes/no question. The easy answer is \"Just looking\", and the talk is over."},{"t":"Nothing. Wait until the customer asks you.","ok":false,"why":"In a multi-brand store the customer walks to the next counter. Speak first."},{"t":"\"Welcome to Xiaomi! Are you looking for a phone with a better camera, or a longer battery?\"","ok":true,"why":"Greet first, then ask an easy either-or question. Any answer keeps the talk going."}]},{"type":"judge","eyebrow":"Good or bad?","q":"A customer walks up to the Xiaomi zone. Is this a good first sentence?","items":[{"t":"\"Can I help you?\"","ok":false,"why":"The easy answer is \"No, thanks\", and the talk is over."},{"t":"\"Welcome to Xiaomi! Is the phone for you, or for someone in your family?\"","ok":true,"why":"Greeting first, then an easy either-or question. Both answers keep the talk going."},{"t":"\"Do you want to buy a phone today?\"","ok":false,"why":"A yes/no question that feels like pressure. Most customers say \"Just looking\"."},{"t":"Smile and wait until the customer speaks first.","ok":false,"why":"In a multi-brand store the customer walks to the next counter. You speak first."},{"t":"\"Welcome to Xiaomi! Are you looking for a phone with a better camera, or a longer battery?\"","ok":true,"why":"Greeting first, then a question about what they need. Easy to answer."}]},{"type":"read","eyebrow":"Read the customer","q":"Different customers need different openings. Look first, then speak.","method":[["Eyes","What do they look at or pick up?"],["Pace","Fast and direct, or slow and wandering?"],["Clues","Who is with them? What phone do they hold?"]],"intents":["Just looking","Comparing","Ready to buy"],"customers":[{"name":"Customer A","who":"Young man, about 25, alone. Holds a phone with a cracked screen.","see":["Walks straight to the Xiaomi zone","Picks up two models and compares the cameras","Checks the time on his phone"],"intent":2,"intentWhy":"Broken phone, walks straight in, compares two models: he needs a phone today.","options":[{"t":"\"Welcome to Xiaomi! I see you're comparing these two. Is the camera the most important thing for you?\"","g":2,"why":"He is ready. Join what he is already doing and help him decide."},{"t":"\"Welcome to Xiaomi! Are you looking for a phone with a better camera, or a longer battery?\"","g":1,"why":"A good opener, but he already showed you he cares about the camera. Use what you see."},{"t":"\"Welcome to Xiaomi! Take your time, call me if you need anything.\"","g":0,"why":"He wants help now. Stepping back can lose a ready buyer."}]},{"name":"Customer B","who":"Woman, about 45, with her teenage daughter.","see":["Walks slowly past every brand","Reads the price tags on mid-price phones","The daughter points at phones. The mother asks the price."],"intent":1,"intentWhy":"They are shopping around and price matters. The daughter chooses, the mother decides and pays.","options":[{"t":"\"Welcome to Xiaomi! Is the phone for your daughter? What does she use her phone for most?\"","g":2,"why":"You speak to both: the daughter's use and the mother's decision. Budget comes next."},{"t":"\"Welcome to Xiaomi! What price range are you looking at?\"","g":1,"why":"Price matters to her, but starting with the budget feels cold. Ask about the use first."},{"t":"\"Welcome to Xiaomi! This one is our newest and best-selling model.\"","g":0,"why":"You push a phone before you know who it is for or what they can spend."}]},{"name":"Customer C","who":"Man, about 60, alone, hands behind his back.","see":["Walks slowly around the whole store","Looks at phones but doesn't pick any up","Stops a few seconds at each counter"],"intent":0,"intentWhy":"No phone in hand, no comparing, no questions yet. He is just looking.","options":[{"t":"\"Welcome to Xiaomi! Take your time. You can pick up any phone to try. I'm right here if you need me.\"","g":2,"why":"Low pressure: invite him to try and stay close. He comes to you when he is ready."},{"t":"\"Welcome to Xiaomi! Are you looking for a phone with a better camera, or a longer battery?\"","g":1,"why":"Not wrong, but a direct question can feel like too much, too soon for someone just looking. Keep it light."},{"t":"\"Can I help you with something?\"","g":0,"why":"Easy to answer \"No, thanks\", and the talk is over."}]}]},{"type":"clip","src":"media/L1-S3.mp4","eyebrow":"The customer answers","title":"\"I'm just looking, thanks.\"","dur":2.1},{"type":"clip","src":"media/L1-S4.mp4","eyebrow":"Watch","title":"Give space, stay close","dur":12.5},{"type":"choice","eyebrow":"Choose","q":"The customer says \"I'm just looking, thanks.\" What do you do?","options":[{"t":"Walk next to them and keep talking about the phones.","ok":false,"why":"Following the customer feels like pressure. They will leave sooner."},{"t":"Say \"OK\" and go back to your phone.","ok":false,"why":"Now nobody is there when they have a question. You lose the sale."},{"t":"\"Of course, take your time. You can try any of these phones. Call me if you need anything.\" Then stay close.","ok":true,"why":"Give them space, invite them to try, and stay close without following."}]},{"type":"speak","eyebrow":"Your turn","q":"A customer walks up to your counter. Say your first sentence out loud.","checks":[{"label":"You said \"Welcome to Xiaomi\"","any":["welcome to xiaomi","welcome to xiao mi","welcome to shaomi","welcome to shao mi","welcome to show me","welcome to xiomi","welcome to xaomi","welcome to shiaomi"]},{"label":"You asked an either-or question","any":[" or "]}],"model":"Welcome to Xiaomi! Are you looking for a phone with a better camera, or a longer battery?"},{"type":"clip","src":"media/L1-S5.mp4","eyebrow":"Watch","title":"Remember the rule","dur":9.9},{"type":"rule"},{"type":"task"}]}}</script>

  /* ---------- Sample roster (fixed seed) ---------- */

  var LAST = ['A.', 'B.', 'F.', 'G.', 'H.', 'K.', 'M.', 'N.', 'R.', 'S.', 'T.'];

            due.slice(0, MAXR).forEach(function (no) {

      }
      f.checked = true;
      if (!f.redo[f.pos]) { f.asked++; if (f.ok) f.first++; }
      var gain = f.ok ? (f.redo[f.pos] ? 5 : 10) : 0;
      f.xp += gain;
      render(); reward(f.ok, gain);
    },
    'i-mic': function () {
      var f = U.flow; if (!DICT) return;
      if (f.mic !== 'idle') { DICT.stop().catch(function () {}); return; }
      f.micErr = null;
      DICT.start({ language: 'en' }).catch(function (e) { f.micErr = e && e.code ? e.code : 'upstream_error'; if (f.micErr === 'stopped') f.micErr = null; render(); });
    },
    'i-typeit': function () { var f = U.flow; if (DICT && f.mic !== 'idle') { try { DICT.stop(); } catch (e) {} } f.typing = true; render(); var ta = document.getElementById('speak-type'); if (ta) ta.focus(); },
    'i-retry': function () { var f = U.flow; f.checked = false; f.heard = ''; f.partial = ''; render(); },
    'i-cant': function () { var f = U.flow; if (f.spoke == null) f.spoke = false; interNext(); },
    said: function () { U.flow.said = true; render(); },
    spoke: function (v) { var f = U.flow; f.spoke = v === '1'; if (!f.again) { S.resume = { no: f.no, i: f.i, said: true, spoke: f.spoke }; save(); } render(); },
    finish: function () { var f = U.flow; if (f.again || rec(f.no)) return; completeLesson(f.no); f.i = STEPS.length - 1; go(); },
    recall: function () { var items = todayRecalls(); if (!items.length) return; U.flow = { type: 'recall', items: items, i: 0, shown: false, ok: 0 }; go(); },
    'r-show': function () { U.flow.shown = true; render(); var b = document.querySelector('[data-act="r-rate"][data-arg="1"]'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) {} } },
    'r-rate': function (v) { var f = U.flow, ok = v === '1'; answerRecall(f.items[f.i], ok); if (ok) f.ok++; f.i++; f.shown = false; go(); },
    task: function (no) {
      no = +no; var k = taskKey(no), c = S.tasks[k] || 0; if (c >= TT) return;
      S.tasks[k] = c + 1; if (c + 1 === TT) addLog('task', { n: TT, no: no });
      save(); render();
    },
    consent: function () { S.auth.consent = !S.auth.consent; save(); render(); },
    logout: function () { S.auth.in = false; U.flow = null; U.tab = 'today'; save(); go(); },
    'pin-reset': function () { var m = document.getElementById('pin-reset-msg'); if (m) m.hidden = false; },
    sim: function () { S.dayOffset++; save(); render(); },
    'reset-ask': function () { U.resetAsk = true; render(); },
    'reset-no': function () { U.resetAsk = false; render(); },
    'dbg-free': function () { S.debugFree = !S.debugFree; save(); render(); },
    'dbg-learnall': function () { var d = today(); L.forEach(function (l) { if (!rec(l.no)) S.lessons[l.no] = { day: d, step: 0, due: d + RD[0], hold: false, hist: [], spoke: null }; }); save(); render(); },
    'dbg-reset': function () { var keep = S.auth, ps = S.pilotStart; S = fresh(); S.auth = keep; S.pilotStart = ps; U.flow = null; save(); render(); },
    'dbg-open': function (no) { no = +no; U.mode = 'app'; if (inter(no)) { startInter(no, true, 0); return; } U.flow = { type: 'lesson', no: no, i: 0, again: true, said: false, spoke: null }; go(); },
    'reset-yes': function () { var keep = S.auth, ps = S.pilotStart; S = fresh(); S.auth = keep; S.pilotStart = ps; U.resetAsk = false; U.flow = null; save(); go(); },
    person: function (k) { U.person = U.person === k ? null : k; fillPeople(); },
    copy: function (id) {
      var ta = document.getElementById(id), m = document.getElementById(id + '-msg');
      function done(ok) { m.hidden = false; m.textContent = t(ok ? 'copied' : 'copy_fail'); if (!ok) { ta.focus(); ta.select(); } }
      try { navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
    }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var fn = A[b.dataset.act];
    if (fn) fn(b.dataset.arg, b);
  });
  document.addEventListener('submit', function (e) { if (e.target.id === 'login-form') { e.preventDefault(); submitLogin(); } });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'person-search') { U.q = e.target.value; fillPeople(); }
    if (e.target.id === 'speak-type' && U.flow) { U.flow.heard = e.target.value; var b = document.querySelector('[data-act="i-check"]'); if (b) b.disabled = !e.target.value.trim(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'pilot-start') return;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value), d = m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5 : NaN;
    if (isFinite(d)) { S.pilotStart = d; U.pilotMsg = ''; } else { S.pilotStart = null; U.pilotMsg = t('pilot_bad'); }
    save(); fillGroup();
    var el = document.getElementById('pilot-start'); if (el) { try { el.focus({ preventScroll: true }); } catch (x) {} }
  });

  render();
  cloudInit();
})();
</script>
